<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Krimidinner-Generator{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/themes.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="logo">🔍</span> Krimidinner-Generator</a>
  {% if request.session.get('auth') %}
  <form method="post" action="/logout"><button class="link">Abmelden</button></form>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>

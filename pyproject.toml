[project]
name = "krimidinner"
version = "0.1.0"
description = "Generator für druckfertige Krimidinner-Kits (Gemini + WeasyPrint) mit Web-Oberfläche"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "weasyprint>=62",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
krimi = "krimi.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
krimi = ["web/templates/*.html", "web/static/*", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
